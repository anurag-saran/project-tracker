name: Monthly tracker reports

on:
  schedule:
    # 1st of each month 7:00 America/New_York ≈ 12:00 UTC
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: tracker-monthly
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    outputs:
      month: ${{ steps.meta.outputs.month }}
      pr_number: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Month stamp
        id: meta
        run: echo "month=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install package
        run: uv sync --all-extras

      - name: Init workspace
        run: uv run tracker init

      - name: Digest (all)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACKER_LLM_PROVIDER: ${{ vars.TRACKER_LLM_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          TRACKER_OPENAI_MODEL: ${{ vars.TRACKER_OPENAI_MODEL }}
        run: |
          export TRACKER_LLM_PROVIDER="${TRACKER_LLM_PROVIDER:-anthropic}"
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            export TRACKER_LLM_PROVIDER=null
          fi
          uv run tracker digest all --since 30d

      - name: Pipeline (all)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACKER_LLM_PROVIDER: ${{ vars.TRACKER_LLM_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          TRACKER_OPENAI_MODEL: ${{ vars.TRACKER_OPENAI_MODEL }}
        run: |
          export TRACKER_LLM_PROVIDER="${TRACKER_LLM_PROVIDER:-anthropic}"
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            export TRACKER_LLM_PROVIDER=null
          fi
          uv run tracker pipeline all --since 30d --skip-fetch

      - name: Blogs (all)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACKER_LLM_PROVIDER: ${{ vars.TRACKER_LLM_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          TRACKER_OPENAI_MODEL: ${{ vars.TRACKER_OPENAI_MODEL }}
        run: |
          export TRACKER_LLM_PROVIDER="${TRACKER_LLM_PROVIDER:-anthropic}"
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            export TRACKER_LLM_PROVIDER=null
          fi
          uv run tracker blogs all --since 30d

      - name: Releases (shipped features + next planned)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACKER_LLM_PROVIDER: ${{ vars.TRACKER_LLM_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          TRACKER_OPENAI_MODEL: ${{ vars.TRACKER_OPENAI_MODEL }}
        run: |
          export TRACKER_LLM_PROVIDER="${TRACKER_LLM_PROVIDER:-anthropic}"
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            export TRACKER_LLM_PROVIDER=null
          fi
          uv run tracker releases all

      - name: Module map (always on monthly + manual)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACKER_LLM_PROVIDER: ${{ vars.TRACKER_LLM_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          TRACKER_OPENAI_MODEL: ${{ vars.TRACKER_OPENAI_MODEL }}
        run: |
          export TRACKER_LLM_PROVIDER="${TRACKER_LLM_PROVIDER:-anthropic}"
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            export TRACKER_LLM_PROVIDER=null
          fi
          for p in $(uv run python -c "import yaml; from pathlib import Path; print(' '.join(x['name'] for x in yaml.safe_load(Path('projects.yaml').read_text())['projects']))"); do
            uv run tracker map "$p" --skip-fetch || true
          done

      - name: Monthly rollup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACKER_LLM_PROVIDER: ${{ vars.TRACKER_LLM_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          TRACKER_OPENAI_MODEL: ${{ vars.TRACKER_OPENAI_MODEL }}
        run: |
          export TRACKER_LLM_PROVIDER="${TRACKER_LLM_PROVIDER:-anthropic}"
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            export TRACKER_LLM_PROVIDER=null
          fi
          uv run tracker rollup

      - name: Build site
        run: uv run tracker site

      - name: Open monthly PR (read updates + diff sections)
        id: pr
        env:
          MONTH: ${{ steps.meta.outputs.month }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="tracker/monthly-${MONTH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"

          # Track report artifacts (dated archive + stable latest-* for diffs).
          git add reports
          if [ -f modules.generated.yaml ]; then
            git add modules.generated.yaml
          fi

          echo "Staged files:"
          git diff --staged --name-only | head -100
          if git diff --staged --quiet; then
            echo "No report changes"
            echo "pull-request-number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: monthly tracker reports ${MONTH}"

          git push -u origin "HEAD:refs/heads/${BRANCH}" --force

          BODY_FILE=$(mktemp)
          {
            echo "Monthly OSS tracker run for **${MONTH}** (lookback ~30d)."
            echo
            echo "### How to read this"
            echo "1. **Conversation / PR body** — TL;DRs per project (below)."
            echo "2. **Files changed** — month-over-month diff of each project's sections via stable paths:"
            echo "   - \`reports/<project>/latest-digest.md\`"
            echo "   - \`reports/<project>/latest-pipeline.md\`"
            echo "   - \`reports/<project>/latest-blogs.md\`"
            echo "   - \`reports/<project>/latest-releases.md\`"
            echo "   - \`reports/<project>/latest-people.md\`"
            echo "   - \`reports/<project>/module-map.md\`"
            echo "3. Dated archives under \`reports/<project>/YYYY-MM-DD-*.md\` keep history."
            echo
            echo "---"
            echo
            if [ -f reports/MONTHLY.md ]; then
              cat reports/MONTHLY.md
            else
              echo "_No MONTHLY.md generated._"
            fi
          } > "$BODY_FILE"

          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "Monthly tracker — ${MONTH}" --body-file "$BODY_FILE"
            echo "pull-request-number=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            URL=$(gh pr create \
              --title "Monthly tracker — ${MONTH}" \
              --body-file "$BODY_FILE" \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH")
            echo "Opened $URL"
            NUM=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
            echo "pull-request-number=$NUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: reports
    if: success()
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
