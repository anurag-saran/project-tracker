settings:
  max_repos_per_org: 25
  default_since: 30d

# Focus: vLLM + llm-d + Praxis AI + OpenClaw. Add other projects by appending here.
projects:
  - name: vllm
    description: High-throughput and memory-efficient inference engine for LLMs
    sources:
      - org: vllm-project
        skip_archived: true
      - repo: vllm-project/vllm
        tier: core
      # vLLM Semantic Router (vSR) — decision layer for model/compute routing
      - repo: vllm-project/semantic-router
        tier: core
    pipeline_signals:
      issue_title_prefixes: ["[RFC]", "[Roadmap]"]
      labels: ["RFC"]
      significant_pr:
        labels: ["RFC", "breaking-change"]
        min_files: 25
        min_additions: 500
    people_signals:
      codeowners: [".github/CODEOWNERS"]
    docs_urls:
      - "https://docs.vllm.ai"
      - "https://vllm.ai/blog"
      - "https://vllm-sr.ai"
    blog_urls:
      - "https://vllm.ai/blog"

  - name: llm-d
    description: Kubernetes-native distributed LLM inference (built around vLLM)
    sources:
      - org: llm-d
        skip_archived: true
      - repo: llm-d/llm-d
        tier: core
      - org: llm-d-incubation
        skip_archived: true
        tier: watch
    pipeline_signals:
      issue_title_prefixes: ["[RFC]", "[Proposal]"]
      labels: ["RFC", "proposal"]
      # Approved proposals for public APIs / new components live here.
      proposals_dirs: ["llm-d/llm-d:docs/proposals"]
      significant_pr:
        labels: ["RFC", "proposal"]
        min_files: 20
        min_additions: 400
    people_signals:
      codeowners: [".github/CODEOWNERS", "CODEOWNERS"]
      governance_urls: ["https://llm-d.ai/community/sigs"]
    docs_urls:
      - "https://llm-d.ai"
      - "https://github.com/llm-d/llm-d/tree/main/docs/proposals"
    blog_urls:
      - "https://llm-d.ai/blog"

  - name: praxis
    description: AI gateway / router — provider-aware routing, protocol translation, MCP/A2A (built on Praxis proxy)
    sources:
      - org: praxis-proxy
        skip_archived: true
      - repo: praxis-proxy/ai
        tier: core
      - repo: praxis-proxy/praxis
        tier: core
      - repo: praxis-proxy/policy
        tier: watch
    pipeline_signals:
      issue_title_prefixes: ["[RFC]", "[Proposal]"]
      labels: ["RFC", "proposal", "enhancement"]
      significant_pr:
        labels: ["RFC", "proposal", "breaking-change"]
        min_files: 20
        min_additions: 400
    people_signals:
      codeowners: [".github/CODEOWNERS", "CODEOWNERS"]
    docs_urls:
      - "https://praxis.fast"
      - "https://praxis.fast/ai/"

  - name: openclaw
    description: Open-source self-hosted AI assistant — gateway, channels (chat apps), skills/plugins, local or hosted models
    sources:
      - org: openclaw
        skip_archived: true
      - repo: openclaw/openclaw
        tier: core
      - repo: openclaw/clawhub
        tier: watch
    pipeline_signals:
      issue_title_prefixes: ["[RFC]", "[Proposal]"]
      labels: ["RFC", "proposal", "enhancement"]
      significant_pr:
        labels: ["RFC", "proposal", "breaking-change"]
        min_files: 20
        min_additions: 400
    people_signals:
      codeowners: [".github/CODEOWNERS", "CODEOWNERS"]
    docs_urls:
      - "https://openclaw.ai"
      - "https://docs.openclaw.ai"
